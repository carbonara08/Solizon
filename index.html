<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOLIZON</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  background:#0A0E14;
  color:white;
  font-family:'DM Sans', sans-serif;
  overflow:hidden;
}

/* HERO /
.hero {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

/ SUN /
.sun {
  width:180px;
  height:180px;
  border-radius:50%;
  background: radial-gradient(circle, #FFE082, #FFB800);
  box-shadow:0 0 100px rgba(255,184,0,0.9);
  position:absolute;
}

/ ORBITS /
.orbit {
  position:absolute;
  border:1px solid rgba(255,184,0,0.3);
  border-radius:50%;
  animation: spin linear infinite;
}

/ DIFFERENT ORBITS /
.orbit1 { width:300px; height:300px; animation-duration:12s; }
.orbit2 { width:420px; height:420px; animation-duration:18s; }
.orbit3 { width:540px; height:540px; animation-duration:25s; }

/ PLANETS /
.planet {
  position:absolute;
  top:50%;
  left:-10px;
  transform:translateY(-50%);
  border-radius:50%;
}

/ DIFFERENT PLANETS /
.p1 { width:14px; height:14px; background:#FFB800; }
.p2 { width:10px; height:10px; background:#6EC1FF; }
.p3 { width:16px; height:16px; background:#FF6B6B; }

@keyframes spin {
  to { transform:rotate(360deg); }
}

/ TEXT */
h1 {
  position:absolute;
  top:10%;
  text-align:center;
  font-family:'Bebas Neue', sans-serif;
  font-size:4rem;
}
</style>
</head>

<body>

<div class="hero">

  <h1>SOLIZON</h1>

  <div class="sun"></div>

  <div class="orbit orbit1">
    <div class="planet p1"></div>
  </div>

  <div class="orbit orbit2">
    <div class="planet p2"></div>
  </div>

  <div class="orbit orbit3">
    <div class="planet p3"></div>
  </div>

</div>

</body>
</html>
